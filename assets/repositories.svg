    <line x1="224.0" y1="117.0" x2="626.0" y2="117.0" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 6"/><line x1="626.0" y1="117.0" x2="224.0" y2="231.0" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 6"/><line x1="224.0" y1="231.0" x2="626.0" y2="231.0" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 6"/>

