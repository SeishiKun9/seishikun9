    <g><rect x="34" y="68" width="380" height="98" rx="14" fill="#0F1738" fill-opacity="0.94" stroke="#2A3975" stroke-width="1"/><rect x="50" y="68" width="64" height="2" rx="1" fill="#3572A5"/><path d="M52 84h10a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H52a1.5 1.5 0 0 1-1.5-1.5v-10A1.5 1.5 0 0 1 52 84zm1 2.2v8.2h8v-8.2z" fill="#38BDF8"/><text x="70" y="95" fill="#F8FAFC" font-size="14" font-weight="700" class="sans">seishikun</text><circle cx="396" cy="90" r="3" fill="#3572A5" class="tw1" filter="url(#glow)"/><text x="52" y="114" fill="#CBD5E1" font-size="11.5" class="sans">Animated universe-themed GitHub profile powered</text><text x="52" y="130" fill="#CBD5E1" font-size="11.5" class="sans">by self-updating SVG telemetry.</text><circle cx="56" cy="149" r="4.2" fill="#3572A5"/><text x="66" y="153" fill="#94A3B8" font-size="11" class="mono">Python</text><path d="M276 143l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z" fill="#FBBF24"/><text x="286" y="153" fill="#CBD5E1" font-size="11" class="mono">12</text><circle cx="348" cy="145" r="2" fill="none" stroke="#A78BFA" stroke-width="1.3"/><circle cx="356" cy="145" r="2" fill="none" stroke="#A78BFA" stroke-width="1.3"/><circle cx="352" cy="153" r="2" fill="none" stroke="#A78BFA" stroke-width="1.3"/><path d="M348 147v2h8v-2M352 149v2" fill="none" stroke="#A78BFA" stroke-width="1.3"/><text x="363" y="153" fill="#CBD5E1" font-size="11" class="mono">3</text></g><g><rect x="436" y="68" width="380" height="98" rx="14" fill="#0F1738" fill-opacity="0.94" stroke="#2A3975" stroke-width="1"/><rect x="452" y="68" width="64" height="2" rx="1" fill="#3178C6"/><path d="M454 84h10a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H454a1.5 1.5 0 0 1-1.5-1.5v-10A1.5 1.5 0 0 1 454 84zm1 2.2v8.2h8v-8.2z" fill="#38BDF8"/><text x="472" y="95" fill="#F8FAFC" font-size="14" font-weight="700" class="sans">nebula-ui</text><circle cx="798" cy="90" r="3" fill="#3178C6" class="tw2" filter="url(#glow)"/><text x="454" y="114" fill="#CBD5