    <text x="816" y="37" text-anchor="end" fill="#34D399" font-size="10.5" font-weight="600" letter-spacing="0.8" class="mono">LIVE SYNC · 2026-11-25</text>
    <line x1="34" y1="49" x2="816" y2="49" stroke="#2A3975" stroke-width="1"/>

    <!-- Orbital Streak Gauge -->
