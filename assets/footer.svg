    <text x="425" y="47" text-anchor="middle" fill="#F8FAFC" font-size="11.5" font-weight="600" letter-spacing="1.6" class="mono">TRANSMISSION OPEN · EXPLORE THE REPOSITORIES ABOVE</text>
